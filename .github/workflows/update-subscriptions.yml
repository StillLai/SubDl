name: Update Subscriptions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'template/sing-box_template.jsonc'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
      
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        
    - run: pip install requests brotli
        
    # 注意：dotenv 是 Sub-Store proxy-utils.esm.mjs 库的内部依赖，请勿移除
    - run: npm install jsdom dotenv
        
    - name: Update subscriptions
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        USER_AGENT: ${{ secrets.USER_AGENT || 'clash-verge/v2.4.4' }}
        SUB_URL: ${{ secrets.SUB_URL }}
        SUB_URL_1: ${{ secrets.SUB_URL_1 }}
        SUB_URL_2: ${{ secrets.SUB_URL_2 }}
        SUB_URL_3: ${{ secrets.SUB_URL_3 }}
        SUB_URL_4: ${{ secrets.SUB_URL_4 }}
        SUB_URL_5: ${{ secrets.SUB_URL_5 }}
      run: python src/update_subscriptions.py
      
    - name: Sync sing-box docs
      run: |
        # 1. 同步 reF1nd/sing-box docs（reF1nd-stable 分支）
        git clone --depth 1 --filter=blob:none --sparse --branch reF1nd-stable https://github.com/reF1nd/sing-box.git /tmp/sing-box-reF1nd
        cd /tmp/sing-box-reF1nd
        git sparse-checkout set docs
        rm -rf $GITHUB_WORKSPACE/sing-box-reF1nd-docs
        cp -r docs $GITHUB_WORKSPACE/sing-box-reF1nd-docs
        cd $GITHUB_WORKSPACE
        rm -rf /tmp/sing-box-reF1nd

        # 2. 同步 SagerNet/sing-box docs（stable 分支）
        git clone --depth 1 --filter=blob:none --sparse --branch stable https://github.com/SagerNet/sing-box.git /tmp/sing-box-official
        cd /tmp/sing-box-official
        git sparse-checkout set docs
        rm -rf $GITHUB_WORKSPACE/sing-box-docs
        cp -r docs $GITHUB_WORKSPACE/sing-box-docs
        cd $GITHUB_WORKSPACE
        rm -rf /tmp/sing-box-official

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md template/sing-box_template_noTun.jsonc template/sing-box_template_tproxy.jsonc template/sing-box_template_tun_for_win.jsonc sing-box-reF1nd-docs/ sing-box-docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update subscription info [skip ci]"
        git push
