name: Template Update

on:
  push:
    paths:
      - 'config_template/sing-box_template.jsonc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Python dependencies
      working-directory: src
      run: pip install -r requirements.txt

    - name: Generate template variants
      working-directory: src
      run: python template_update.py

    - name: Commit and push template variants
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add config_template/sing-box_template_noTun.jsonc config_template/sing-box_template_tproxy.jsonc config_template/sing-box_template_tun_for_win.jsonc
        git diff --quiet && git diff --staged --quiet || git commit -m "Update template variants [skip ci]"
        git push

