name: Docs Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 防止多次运行重叠
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write    # 推送同步的文档
  pages: write       # 部署 Pages
  id-token: write    # Pages OIDC token

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Sync documentation
      run: |
        set -Eeuo pipefail
        git clone --depth 1 --filter=blob:none --sparse --branch reF1nd-stable https://github.com/reF1nd/sing-box.git /tmp/sing-box-reF1nd
        cd /tmp/sing-box-reF1nd
        git sparse-checkout set docs
        rm -rf "$GITHUB_WORKSPACE/sing-box-reF1nd-docs"
        cp -r docs "$GITHUB_WORKSPACE/sing-box-reF1nd-docs"
        # 同步 mkdocs.yml 用于构建（sparse-checkout 不支持单个文件，用 git show 直接提取）
        git show HEAD:mkdocs.yml > "$GITHUB_WORKSPACE/mkdocs.yml"

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add sing-box-reF1nd-docs/ mkdocs.yml
        git diff --quiet && git diff --staged --quiet || git commit -m "Sync sing-box docs [skip ci]"
        git push

    - name: Install mkdocs-material
      run: pip install mkdocs-material mkdocs-static-i18n

    - name: Adjust mkdocs.yml paths
      run: |
        # 源仓库 mkdocs.yml 没有 docs_dir/site_dir（使用默认值），追加覆盖
        echo 'docs_dir: sing-box-reF1nd-docs' >> mkdocs.yml
        echo 'site_dir: site' >> mkdocs.yml

    - name: Build documentation
      run: mkdocs build --strict

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4