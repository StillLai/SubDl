name: Docs Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 防止多次运行重叠
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write    # 推送同步的文档
  pages: write       # 部署 Pages
  id-token: write    # Pages OIDC token

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Sync documentation
      run: |
        set -Eeuo pipefail
        git clone --depth 1 --filter=blob:none --sparse --branch reF1nd-stable https://github.com/reF1nd/sing-box.git /tmp/sing-box-reF1nd
        cd /tmp/sing-box-reF1nd
        git sparse-checkout set docs
        rm -rf "$GITHUB_WORKSPACE/sing-box-reF1nd-docs"
        cp -r docs "$GITHUB_WORKSPACE/sing-box-reF1nd-docs"
        # 移除非本仓库的 CNAME 文件
        rm -f "$GITHUB_WORKSPACE/sing-box-reF1nd-docs/CNAME"
        # 从源仓库提取 mkdocs.yml 到临时目录（不提交到仓库）
        git show HEAD:mkdocs.yml > /tmp/mkdocs.yml

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add sing-box-reF1nd-docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Sync sing-box docs [skip ci]"
        git push

    - name: Install mkdocs-material
      run: pip install mkdocs-material mkdocs-static-i18n

    - name: Adjust mkdocs.yml for this repo
      run: |
        # 修正 site_url 为实际 GitHub Pages 地址
        sed -i 's|^site_url:.*|site_url: https://stilllai.github.io/SubDl/|' /tmp/mkdocs.yml
        # 追加路径覆盖（源仓库使用默认值 docs/，本仓库文档在 sing-box-reF1nd-docs/）
        echo 'docs_dir: sing-box-reF1nd-docs' >> /tmp/mkdocs.yml
        echo 'site_dir: site' >> /tmp/mkdocs.yml

    - name: Build documentation
      run: mkdocs build -f /tmp/mkdocs.yml --strict

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4