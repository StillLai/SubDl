name: Ruleset Update

on:
  push:
    branches: [main]
    paths:
      - 'ruleset/custom_rule/**'
      - 'ruleset/ruleset_source.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: "Setup sing-box"
      run: |
          set -Eeuo pipefail
          ASSET_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -o 'https://github.com/SagerNet/sing-box/releases/download/[^"]*linux_amd64.deb')
          wget -O sing-box.deb $ASSET_URL
          sudo dpkg -i sing-box.deb

    - name: Set up Python3
      uses: actions/setup-python@v6
      with:
        python-version: 3.x
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements-ruleset.txt

    - name: Run script
      run: python src/ruleset_convert.py

    - name: Upload JSON to Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ruleset-json
        files: ruleset/json/*.json
        fail_on_unmatched_files: true

    - name: Upload SRS to Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ruleset-srs
        files: ruleset/srs/*.srs
        fail_on_unmatched_files: true
