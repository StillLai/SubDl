name: Ruleset Update

on:
  push:
    branches: [main]
    paths:
      - 'ruleset/custom_rule/**'
      - 'ruleset/ruleset_source.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# 防止多次运行重叠
concurrency:
  group: ruleset-update
  cancel-in-progress: false

# sing-box 二进制通过 actions/cache 按版本号缓存，版本不变时跳过下载

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Python dependencies
      run: pip install -r src/requirements.txt

    - name: Setup sing-box
      id: setup-singbox
      uses: ./.github/actions/setup-sing-box
      with:
        repo: SagerNet/sing-box
        output-path: .cache/sing-box
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Export sing-box path
      run: |
        echo "SING_BOX_BIN=${{ steps.setup-singbox.outputs.bin-path }}" >> "$GITHUB_ENV"

    - name: Build rulesets
      run: python src/ruleset_convert.py

    - name: Verify generated files
      run: |
        set -Eeuo pipefail
        JSON_COUNT=$(ls ruleset/json/*.json 2>/dev/null | wc -l)
        SRS_COUNT=$(ls ruleset/srs/*.srs 2>/dev/null | wc -l)
        if [ "$JSON_COUNT" -eq 0 ] || [ "$SRS_COUNT" -eq 0 ]; then
          echo "::error::No generated files found! JSON: $JSON_COUNT, SRS: $SRS_COUNT"
          exit 1
        fi
        echo "✅ Verified: $JSON_COUNT JSON files, $SRS_COUNT SRS files"

    - name: Recreate releases with fresh timestamps
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail

        # 删除旧 release（保留 tag），然后重新创建
        # GH API 无法通过 PATCH 更新 published_at，只能重建 release
        for TAG in ruleset-json ruleset-srs; do
          echo "🔄 Recreating release: $TAG"
          gh release delete "$TAG" --yes 2>/dev/null || true
          if [ "$TAG" = "ruleset-json" ]; then
            gh release create "$TAG" --target main --title "$TAG" --notes "Auto-generated JSON rulesets" ruleset/json/*.json
          else
            gh release create "$TAG" --target main --title "$TAG" --notes "Auto-generated SRS rulesets" ruleset/srs/*.srs
          fi
          echo "✅ Release $TAG recreated"
        done

        echo "✅ All releases recreated with fresh timestamps"
