name: Ruleset Update

on:
  push:
    branches: [main]
    paths:
      - 'ruleset/custom_rule/**'
      - 'ruleset/ruleset_source.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# 防止多次运行重叠
concurrency:
  group: ruleset-update
  cancel-in-progress: false

# 缓存经验法则：仅当「直接下载/重新生成」比 8s cache restore 更慢时才用 actions/cache
# 当前不 cache：GitHub Releases 直接 wget sing-box.deb 比 cache restore 快

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Setup environment
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        pip install -r src/requirements.txt &
        JSON=$(gh api repos/SagerNet/sing-box/releases/latest)
        ASSET_URL=$(echo "$JSON" | jq -r '.assets[] | select(.name | endswith("linux_amd64.deb")) | .browser_download_url')
        if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
          echo "::error::Failed to get sing-box .deb asset URL from release JSON"
          echo "Release JSON: $JSON"
          exit 1
        fi
        wget -O sing-box.deb "$ASSET_URL"
        sudo dpkg -i sing-box.deb
        wait

    - name: Build rulesets
      run: python src/ruleset_convert.py

    - name: Upload JSON to Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ruleset-json
        files: ruleset/json/*.json
        fail_on_unmatched_files: true

    - name: Upload SRS to Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ruleset-srs
        files: ruleset/srs/*.srs
        fail_on_unmatched_files: true
