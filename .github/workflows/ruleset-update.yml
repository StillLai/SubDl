name: Ruleset Update

on:
  push:
    branches: [main]
    paths:
      - 'ruleset/custom_rule/**'
      - 'ruleset/ruleset_source.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: "Setup sing-box"
      run: |
          set -Eeuo pipefail
          ASSET_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -o 'https://github.com/SagerNet/sing-box/releases/download/[^"]*linux_amd64.deb')
          wget -O sing-box.deb $ASSET_URL
          sudo dpkg -i sing-box.deb

    - name: Set up Python3
      uses: actions/setup-python@v6
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    - name: Run script
      run: python src/ruleset_convert.py

    - name: Commit and push config.json
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add -f ./ruleset/json/*.json
        git add -f ./ruleset/srs/*.srs

        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git commit -m "Update rules"
          git push
        fi
