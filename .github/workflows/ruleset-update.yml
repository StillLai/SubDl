name: Ruleset Update

on:
  push:
    branches: [main]
    paths:
      - 'ruleset/custom_rule/**'
      - 'ruleset/ruleset_source.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# 防止多次运行重叠
concurrency:
  group: ruleset-update
  cancel-in-progress: false

# sing-box 二进制通过 actions/cache 按版本号缓存，版本不变时跳过下载

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Python dependencies
      run: pip install -r src/requirements.txt

    - name: Get sing-box version
      id: singbox-ver
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        VERSION=$(gh api repos/SagerNet/sing-box/releases/latest --jq '.tag_name')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✓ sing-box 最新版本: $VERSION"

    - name: Cache sing-box binary
      uses: actions/cache@v6
      id: cache-singbox
      with:
        path: .cache/sing-box-official
        key: sing-box-official-${{ steps.singbox-ver.outputs.version }}

    - name: Download sing-box
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        mkdir -p .cache
        DEST=".cache/sing-box-official"

        download_singbox() {
          local ver="$1" dest="$2"
          echo "→ 下载 sing-box $ver..."
          local tmpdir
          tmpdir=$(mktemp -d)
          gh release download "$ver" --repo SagerNet/sing-box --pattern "*linux-amd64-glibc.tar.gz" --dir "$tmpdir" --clobber
          local bin=""
          for f in "$tmpdir"/*.tar.gz; do
            [ -f "$f" ] || continue
            tar xzf "$f" -C "$tmpdir"
            bin=$(find "$tmpdir" -name sing-box -type f -not -path "*.json" | head -1)
            [ -n "$bin" ] && break
          done
          if [ -z "$bin" ]; then
            echo "::error::找不到 sing-box $ver 的二进制"
            rm -rf "$tmpdir"
            exit 1
          fi
          cp "$bin" "$dest"
          rm -rf "$tmpdir"
          chmod +x "$dest"
          if "$dest" version >/dev/null 2>&1; then
            echo "✓ $dest 就绪: $("$dest" version)"
          else
            echo "::error::$dest 下载成功但无法执行，请检查架构兼容性"
            exit 1
          fi
        }

        if [ "${{ steps.cache-singbox.outputs.cache-hit }}" == "true" ] && [ -f "$DEST" ]; then
          chmod +x "$DEST"
          if "$DEST" version >/dev/null 2>&1; then
            echo "✓ 命中缓存: sing-box"
          else
            echo "⚠ 缓存的 sing-box 无法执行（可能 runner 环境已变更），重新下载..."
            rm -f "$DEST"
            download_singbox "${{ steps.singbox-ver.outputs.version }}" "$DEST"
          fi
        else
          rm -f "$DEST"
          download_singbox "${{ steps.singbox-ver.outputs.version }}" "$DEST"
        fi

        # 通过 GITHUB_ENV 传递绝对路径
        ABS_BIN="$(readlink -f "$DEST")"
        ls -la "$ABS_BIN"
        echo "SING_BOX_BIN=$ABS_BIN" >> "$GITHUB_ENV"

    - name: Build rulesets
      run: python src/ruleset_convert.py

    - name: Verify generated files
      run: |
        set -Eeuo pipefail
        JSON_COUNT=$(ls ruleset/json/*.json 2>/dev/null | wc -l)
        SRS_COUNT=$(ls ruleset/srs/*.srs 2>/dev/null | wc -l)
        if [ "$JSON_COUNT" -eq 0 ] || [ "$SRS_COUNT" -eq 0 ]; then
          echo "::error::No generated files found! JSON: $JSON_COUNT, SRS: $SRS_COUNT"
          exit 1
        fi
        echo "✅ Verified: $JSON_COUNT JSON files, $SRS_COUNT SRS files"

    - name: Upload and clean release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail

        # ===== 1. 先上传所有新文件（覆盖同名旧文件）=====
        echo "⬆️ Uploading JSON rulesets..."
        gh release upload ruleset-json ruleset/json/*.json --clobber
        echo "⬆️ Uploading SRS rulesets..."
        gh release upload ruleset-srs ruleset/srs/*.srs --clobber
        echo "✅ All files uploaded successfully"

        # ===== 2. 上传全部成功后，清理多余的旧 asset =====
        # 获取当前 release 上的 asset 列表
        EXISTING_JSON=$(gh release view ruleset-json --json assets --jq '.assets[].name')
        EXISTING_SRS=$(gh release view ruleset-srs --json assets --jq '.assets[].name')

        # 获取本地新生成的文件名列表
        LOCAL_JSON=$(ls ruleset/json/*.json | xargs -I{} basename {})
        LOCAL_SRS=$(ls ruleset/srs/*.srs | xargs -I{} basename {})

        # 删除 release 上存在但本地已不存在的 asset
        for asset in $EXISTING_JSON; do
          if ! echo "$LOCAL_JSON" | grep -qxF "$asset"; then
            echo "🗑️ Deleting stale asset: $asset"
            gh release delete-asset ruleset-json "$asset" --yes || true
          fi
        done
        for asset in $EXISTING_SRS; do
          if ! echo "$LOCAL_SRS" | grep -qxF "$asset"; then
            echo "🗑️ Deleting stale asset: $asset"
            gh release delete-asset ruleset-srs "$asset" --yes || true
          fi
        done

        echo "✅ Release assets updated successfully"
