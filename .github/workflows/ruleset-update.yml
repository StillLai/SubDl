name: Ruleset Update

on:
  push:
    branches: [main]
    paths:
      - 'ruleset/custom_rule/**'
      - 'ruleset/ruleset_source.txt'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

# 防止多次运行重叠
concurrency:
  group: ruleset-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Get sing-box version
      id: get_version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        JSON=$(gh api repos/SagerNet/sing-box/releases/latest)
        VERSION=$(echo "$JSON" | jq -r '.tag_name')
        ASSET_URL=$(echo "$JSON" | jq -r '.assets[] | select(.name | endswith("linux_amd64.deb")) | .browser_download_url')
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ] || [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
          echo "::error::Failed to extract version or asset URL from release JSON"
          echo "Release JSON: $JSON"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

    - name: Restore sing-box deb cache
      id: cache-deb
      uses: actions/cache@v5
      with:
        path: sing-box.deb
        key: sing-box-deb-${{ steps.get_version.outputs.version }}

    - name: Setup sing-box
      run: |
        set -Eeuo pipefail
        if [ ! -f sing-box.deb ]; then
          wget -O sing-box.deb "${{ steps.get_version.outputs.asset_url }}"
        else
          echo "sing-box.deb restored from cache, skipping download"
        fi
        sudo dpkg -i sing-box.deb

    - name: Cache pip
      id: cache-pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ hashFiles('src/requirements.txt') }}

    - name: Install Python dependencies
      working-directory: src
      run: pip install -r requirements.txt

    - name: Run script
      run: python src/ruleset_convert.py

    - name: Upload JSON to Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ruleset-json
        files: ruleset/json/*.json
        fail_on_unmatched_files: true

    - name: Upload SRS to Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ruleset-srs
        files: ruleset/srs/*.srs
        fail_on_unmatched_files: true
