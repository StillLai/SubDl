name: Subscriptions Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'config_template/**'

# 防止多次运行重叠（保证 Gist 状态一致）
concurrency:
  group: subscriptions-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    # --- Python 依赖安装 ---
    - name: Install Python dependencies
      run: pip install -r src/requirements.txt

    # dotenv 是 Sub-Store proxy-utils.esm.mjs 库的内部依赖，请勿移除
    - name: Install Node dependencies
      working-directory: src
      run: npm ci

    # --- sing-box 二进制缓存（用于配置校验） ---
    - name: Get sing-box versions
      id: singbox-ver
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        OFFICIAL=$(gh api repos/SagerNet/sing-box/releases/latest --jq '.tag_name')
        REF1ND=$(gh api repos/reF1nd/sing-box-releases/releases/latest --jq '.tag_name')
        echo "official=$OFFICIAL" >> $GITHUB_OUTPUT
        echo "ref1nd=$REF1ND" >> $GITHUB_OUTPUT
        echo "✓ sing-box 官方版: $OFFICIAL | reF1nd: $REF1ND"

    - name: Cache sing-box (official)
      uses: actions/cache@v6
      id: cache-official
      with:
        path: .cache/sing-box-official
        key: sing-box-official-${{ steps.singbox-ver.outputs.official }}

    - name: Cache sing-box (reF1nd)
      uses: actions/cache@v6
      id: cache-ref1nd
      with:
        path: .cache/sing-box-ref1nd
        key: sing-box-ref1nd-${{ steps.singbox-ver.outputs.ref1nd }}

    - name: Download sing-box binaries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        mkdir -p .cache
        CACHE_DIR="$(pwd)/.cache"

        download_singbox() {
          local repo="$1" ver="$2" dest="$3"
          echo "→ 从 $repo 下载 $ver..."
          # 使用 Python 下载并提取二进制（可靠且跨平台）
          python -c "
        import json, subprocess, tempfile, tarfile, zipfile, os, sys, shutil
        from urllib.request import urlopen, Request
        from pathlib import Path

        repo = '$repo'
        ver = '$ver'
        dest = '$dest'

        # 通过 gh api 获取所有 asset
        result = subprocess.run(
            ['gh', 'api', f'repos/{repo}/releases/tags/{ver}', '--jq', '.assets[] | {name, url: .browser_download_url}'],
            capture_output=True, text=True
        )
        assets = [json.loads(line) for line in result.stdout.strip().split('\n') if line.strip()]

        # 优先找 tar.gz
        tar_asset = next((a for a in assets if a['name'].endswith('.tar.gz')), None)
        deb_asset = next((a for a in assets if a['name'].endswith('.deb')), None)

        binary_found = False

        if tar_asset:
            print(f'  下载 {tar_asset[\"name\"]}...')
            req = Request(tar_asset['url'], headers={'Authorization': f'token {os.environ[\"GH_TOKEN\"]}'})
            with tempfile.TemporaryDirectory() as tmpdir:
                tar_path = os.path.join(tmpdir, 'archive.tar.gz')
                with urlopen(req, timeout=120) as resp, open(tar_path, 'wb') as f:
                    shutil.copyfileobj(resp, f)
                with tarfile.open(tar_path, 'r:gz') as tf:
                    tf.extractall(tmpdir)
                # 递归查找 sing-box 二进制
                for p in Path(tmpdir).rglob('sing-box'):
                    if p.is_file() and not p.name.endswith('.json'):
                        shutil.copy2(str(p), dest)
                        binary_found = True
                        break

        if not binary_found and deb_asset:
            print(f'  下载 {deb_asset[\"name\"]}...')
            req = Request(deb_asset['url'], headers={'Authorization': f'token {os.environ[\"GH_TOKEN\"]}'})
            with tempfile.TemporaryDirectory() as tmpdir:
                deb_path = os.path.join(tmpdir, 'package.deb')
                with urlopen(req, timeout=120) as resp, open(deb_path, 'wb') as f:
                    shutil.copyfileobj(resp, f)
                subprocess.run(['dpkg-deb', '-x', deb_path, tmpdir + '/extract'], check=True)
                for p in Path(tmpdir + '/extract').rglob('sing-box'):
                    if p.is_file() and not p.name.endswith('.json'):
                        shutil.copy2(str(p), dest)
                        binary_found = True
                        break

        if not binary_found:
            print(f'::error::找不到 {repo} {ver} 的二进制 asset', file=sys.stderr)
            sys.exit(1)
        "
          chmod +x "$dest"
          echo "✓ $dest 就绪: $("$dest" version || echo '未知版本')"
        }

        # 官方版
        if [ "${{ steps.cache-official.outputs.cache-hit }}" == "true" ] && [ -f "$CACHE_DIR/sing-box-official" ]; then
          echo "✓ 命中缓存: sing-box 官方版"
          chmod +x "$CACHE_DIR/sing-box-official"
        else
          rm -f "$CACHE_DIR/sing-box-official"
          download_singbox "SagerNet/sing-box" "${{ steps.singbox-ver.outputs.official }}" "$CACHE_DIR/sing-box-official"
        fi

        # reF1nd 版
        if [ "${{ steps.cache-ref1nd.outputs.cache-hit }}" == "true" ] && [ -f "$CACHE_DIR/sing-box-ref1nd" ]; then
          echo "✓ 命中缓存: sing-box reF1nd"
          chmod +x "$CACHE_DIR/sing-box-ref1nd"
        else
          rm -f "$CACHE_DIR/sing-box-ref1nd"
          download_singbox "reF1nd/sing-box-releases" "${{ steps.singbox-ver.outputs.ref1nd }}" "$CACHE_DIR/sing-box-ref1nd"
        fi

    # 预下载 Sub-Store proxy-utils.esm.mjs（convert.mjs 直接 import，无自动下载能力）
    - name: Pre-download Sub-Store dependency
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        set -Eeuo pipefail
        mkdir -p src/deps
        RELEASE_JSON=$(gh api repos/sub-store-org/Sub-Store/releases/latest)
        TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
        DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.uploader.login == "github-actions[bot]" and .name == "proxy-utils.esm.mjs") | .browser_download_url')
        if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
          echo "::error::Sub-Store proxy-utils asset not found in release $TAG_NAME"
          exit 1
        fi
        curl -fsSL -o src/deps/proxy-utils.esm.mjs "$DOWNLOAD_URL"
        [ -s src/deps/proxy-utils.esm.mjs ] || { echo "::error::Downloaded file is empty"; exit 1; }
        echo "✓ Pre-downloaded proxy-utils.esm.mjs ($TAG_NAME)"

    - name: Build subscriptions
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        SING_BOX_BIN: ${{ github.workspace }}/.cache/sing-box-official
        SING_BOX_REF1ND_BIN: ${{ github.workspace }}/.cache/sing-box-ref1nd
        GIST_ID: ${{ secrets.GIST_ID }}
        SUB_URL: ${{ secrets.SUB_URL }}
        SUB_URL_1: ${{ secrets.SUB_URL_1 }}
        SUB_URL_2: ${{ secrets.SUB_URL_2 }}
        SUB_URL_3: ${{ secrets.SUB_URL_3 }}
        SUB_URL_4: ${{ secrets.SUB_URL_4 }}
        SUB_URL_5: ${{ secrets.SUB_URL_5 }}
        SUB_URL_6: ${{ secrets.SUB_URL_6 }}
        SUB_URL_7: ${{ secrets.SUB_URL_7 }}
        SUB_URL_8: ${{ secrets.SUB_URL_8 }}
        SUB_URL_9: ${{ secrets.SUB_URL_9 }}
      run: python src/update_subscriptions.py

    - name: Deploy SVG to assets branch
      run: |
        # 在独立目录初始化 git 并推送到 assets 分支（避免污染工作区）
        REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        mkdir -p /tmp/assets-deploy
        cp status-light.svg status-dark.svg /tmp/assets-deploy/
        cd /tmp/assets-deploy
        git init
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add status-light.svg status-dark.svg
        git commit -m "Update status SVGs [skip ci]"
        git push --force "$REPO_URL" HEAD:assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}