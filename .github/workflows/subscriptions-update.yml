name: Subscriptions Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'config_template/sing-box_template.jsonc'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
      
    - uses: actions/setup-python@v6
      with:
        python-version: 3.x
        cache: 'pip'

    # ════════════════════════════════════════════════════════════
    # ⚠️ 此处故意不加 cache: 'npm'
    # 原因：
    #   1. 本项目没有 package-lock.json / yarn.lock，
    #      setup-node 内置缓存需要 lock 文件来计算缓存 key
    #   2. 仅依赖 jsdom + dotenv 两个包，下载只需 ~2s
    #   3. 同一次 workflow run 内 npm 有内置缓存，不会重复下载
    #   4. 不加缓存反而保证每次拉取最新版，零维护负担
    # ════════════════════════════════════════════════════════════
    - uses: actions/setup-node@v6
      with:
        node-version: '22'

    - run: pip install -r requirements.txt

    # 注意：dotenv 是 Sub-Store proxy-utils.esm.mjs 库的内部依赖，请勿移除
    - run: npm install jsdom dotenv
        
    - name: Update subscriptions
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        USER_AGENT: ${{ secrets.USER_AGENT || 'clash-verge/v2.4.4' }}
        SUB_URL: ${{ secrets.SUB_URL }}
        SUB_URL_1: ${{ secrets.SUB_URL_1 }}
        SUB_URL_2: ${{ secrets.SUB_URL_2 }}
        SUB_URL_3: ${{ secrets.SUB_URL_3 }}
        SUB_URL_4: ${{ secrets.SUB_URL_4 }}
        SUB_URL_5: ${{ secrets.SUB_URL_5 }}
        SUB_URL_6: ${{ secrets.SUB_URL_6 }}
        SUB_URL_7: ${{ secrets.SUB_URL_7 }}
        SUB_URL_8: ${{ secrets.SUB_URL_8 }}
        SUB_URL_9: ${{ secrets.SUB_URL_9 }}
        SUB_URLS: ${{ secrets.SUB_URLS }}
      run: python src/update_subscriptions.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md config_template/sing-box_template_noTun.jsonc config_template/sing-box_template_tproxy.jsonc config_template/sing-box_template_tun_for_win.jsonc
        git diff --quiet && git diff --staged --quiet || git commit -m "Update subscription info [skip ci]"
        git push
