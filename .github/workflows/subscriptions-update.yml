name: Subscriptions Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'config_template/**'

# 防止多次运行重叠（保证 Gist 状态一致）
concurrency:
  group: subscriptions-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    # --- Python 依赖安装 ---
    - name: Install Python dependencies
      run: pip install -r src/requirements.txt

    # dotenv 是 Sub-Store proxy-utils.esm.mjs 库的内部依赖，请勿移除
    - name: Install Node dependencies
      working-directory: src
      run: npm ci

    # --- sing-box 二进制缓存（用于配置校验） ---
    - name: Get sing-box versions
      id: singbox-ver
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        OFFICIAL=$(gh api repos/SagerNet/sing-box/releases/latest --jq '.tag_name')
        REF1ND=$(gh api repos/reF1nd/sing-box-releases/releases/latest --jq '.tag_name')
        echo "official=$OFFICIAL" >> $GITHUB_OUTPUT
        echo "ref1nd=$REF1ND" >> $GITHUB_OUTPUT
        echo "✓ sing-box 官方版: $OFFICIAL | reF1nd: $REF1ND"

    - name: Cache sing-box (official)
      uses: actions/cache@v6
      id: cache-official
      with:
        path: /tmp/sing-box-official
        key: sing-box-official-${{ steps.singbox-ver.outputs.official }}

    - name: Cache sing-box (reF1nd)
      uses: actions/cache@v6
      id: cache-ref1nd
      with:
        path: /tmp/sing-box-ref1nd
        key: sing-box-ref1nd-${{ steps.singbox-ver.outputs.ref1nd }}

    - name: Download sing-box binaries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -Eeuo pipefail
        ARCH="linux-amd64"
        if [ "${{ steps.cache-official.outputs.cache-hit }}" != "true" ]; then
          VER="${{ steps.singbox-ver.outputs.official }}"
          URL=$(gh api repos/SagerNet/sing-box/releases/tags/$VER --jq ".assets[] | select(.name | endswith(\"$ARCH.tar.gz\")) | .browser_download_url")
          curl -fsSL "$URL" | tar xz && mv sing-box-*/sing-box /tmp/sing-box-official && chmod +x /tmp/sing-box-official
          echo "✓ 下载 sing-box 官方版 $VER"
        else
          echo "✓ 命中缓存: sing-box 官方版"
        fi
        if [ "${{ steps.cache-ref1nd.outputs.cache-hit }}" != "true" ]; then
          VER="${{ steps.singbox-ver.outputs.ref1nd }}"
          URL=$(gh api repos/reF1nd/sing-box-releases/releases/tags/$VER --jq ".assets[] | select(.name | endswith(\"$ARCH.tar.gz\")) | .browser_download_url")
          curl -fsSL "$URL" | tar xz && mv sing-box-*/sing-box /tmp/sing-box-ref1nd && chmod +x /tmp/sing-box-ref1nd
          echo "✓ 下载 sing-box reF1nd $VER"
        else
          echo "✓ 命中缓存: sing-box reF1nd"
        fi

    # 预下载 Sub-Store proxy-utils.esm.mjs（convert.mjs 直接 import，无自动下载能力）
    - name: Pre-download Sub-Store dependency
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        set -Eeuo pipefail
        mkdir -p src/deps
        RELEASE_JSON=$(gh api repos/sub-store-org/Sub-Store/releases/latest)
        TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
        DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.uploader.login == "github-actions[bot]" and .name == "proxy-utils.esm.mjs") | .browser_download_url')
        if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
          echo "::error::Sub-Store proxy-utils asset not found in release $TAG_NAME"
          exit 1
        fi
        curl -fsSL -o src/deps/proxy-utils.esm.mjs "$DOWNLOAD_URL"
        [ -s src/deps/proxy-utils.esm.mjs ] || { echo "::error::Downloaded file is empty"; exit 1; }
        echo "✓ Pre-downloaded proxy-utils.esm.mjs ($TAG_NAME)"

    - name: Build subscriptions
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        SING_BOX_BIN: /tmp/sing-box-official
        SING_BOX_REF1ND_BIN: /tmp/sing-box-ref1nd
        GIST_ID: ${{ secrets.GIST_ID }}
        SUB_URL: ${{ secrets.SUB_URL }}
        SUB_URL_1: ${{ secrets.SUB_URL_1 }}
        SUB_URL_2: ${{ secrets.SUB_URL_2 }}
        SUB_URL_3: ${{ secrets.SUB_URL_3 }}
        SUB_URL_4: ${{ secrets.SUB_URL_4 }}
        SUB_URL_5: ${{ secrets.SUB_URL_5 }}
        SUB_URL_6: ${{ secrets.SUB_URL_6 }}
        SUB_URL_7: ${{ secrets.SUB_URL_7 }}
        SUB_URL_8: ${{ secrets.SUB_URL_8 }}
        SUB_URL_9: ${{ secrets.SUB_URL_9 }}
      run: python src/update_subscriptions.py

    - name: Deploy SVG to assets branch
      run: |
        # 在独立目录初始化 git 并推送到 assets 分支（避免污染工作区）
        REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        mkdir -p /tmp/assets-deploy
        cp status-light.svg status-dark.svg /tmp/assets-deploy/
        cd /tmp/assets-deploy
        git init
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add status-light.svg status-dark.svg
        git commit -m "Update status SVGs [skip ci]"
        git push --force "$REPO_URL" HEAD:assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}