name: Subscriptions Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'config_template/sing-box_template.jsonc'

# 防止多次运行重叠（保证 Gist 状态一致）
concurrency:
  group: subscriptions-update
  cancel-in-progress: false

# 缓存经验法则：仅当「直接下载/重新生成」比 8s cache restore 更慢时才用 actions/cache
#   - 适合：克隆大仓库、重新生成很贵的场景
#   - 不适合：源端本身快（PyPI / GitHub Releases / npm registry）
#   - 当前不 cache：actions/cache post-job cleanup 8s 抵消了大部分收益

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install Python dependencies
      working-directory: src
      run: pip install -r requirements.txt

    # dotenv 是 Sub-Store proxy-utils.esm.mjs 库的内部依赖，请勿移除
    - name: Install Node dependencies
      working-directory: src
      run: npm ci

    # 预下载 Sub-Store proxy-utils，使 convert.mjs 的 checkAndUpdateDeps() 命中缓存直接跳过
    - name: Pre-download Sub-Store dependency
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        mkdir -p src/deps
        RELEASE_JSON=$(gh api repos/sub-store-org/Sub-Store/releases/latest)
        TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
        DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.uploader.login == "github-actions[bot]" and .name == "proxy-utils.esm.mjs") | .browser_download_url')
        if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
          curl -sL -o src/deps/proxy-utils.esm.mjs "$DOWNLOAD_URL"
          printf '%s\n%s' "$TAG_NAME" "$(date +%s%3N)" > src/deps/.version
          echo "✓ Pre-downloaded proxy-utils.esm.mjs ($TAG_NAME)"
        else
          echo "::warning::Sub-Store dependency not found, convert.mjs will download it"
        fi

    - name: Build subscriptions
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        USER_AGENT: ${{ secrets.USER_AGENT || 'clash-verge/v2.4.4' }}
        SUB_URL: ${{ secrets.SUB_URL }}
        SUB_URL_1: ${{ secrets.SUB_URL_1 }}
        SUB_URL_2: ${{ secrets.SUB_URL_2 }}
        SUB_URL_3: ${{ secrets.SUB_URL_3 }}
        SUB_URL_4: ${{ secrets.SUB_URL_4 }}
        SUB_URL_5: ${{ secrets.SUB_URL_5 }}
        SUB_URL_6: ${{ secrets.SUB_URL_6 }}
        SUB_URL_7: ${{ secrets.SUB_URL_7 }}
        SUB_URL_8: ${{ secrets.SUB_URL_8 }}
        SUB_URL_9: ${{ secrets.SUB_URL_9 }}
        SUB_URLS: ${{ secrets.SUB_URLS }}
      run: python src/update_subscriptions.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md config_template/sing-box_template_noTun.jsonc config_template/sing-box_template_tproxy.jsonc config_template/sing-box_template_tun_for_win.jsonc
        git diff --quiet && git diff --staged --quiet || git commit -m "Update subscription info [skip ci]"
        git push
