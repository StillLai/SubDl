name: Docs Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 防止多次运行重叠
concurrency:
  group: docs-sync
  cancel-in-progress: false

# 缓存经验法则：仅当「直接下载/重新生成」比 8s cache restore 更慢时才用 actions/cache
# 当前不 cache：git clone --sparse 跟 cache restore 差不多，没省

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Sync sing-box docs
      run: |
        set -Eeuo pipefail
        git clone --depth 1 --filter=blob:none --sparse --branch reF1nd-stable https://github.com/reF1nd/sing-box.git /tmp/sing-box-reF1nd
        cd /tmp/sing-box-reF1nd
        git sparse-checkout set docs
        rm -rf "$GITHUB_WORKSPACE/sing-box-reF1nd-docs"
        cp -r docs "$GITHUB_WORKSPACE/sing-box-reF1nd-docs"

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add sing-box-reF1nd-docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Sync sing-box docs [skip ci]"
        git push
