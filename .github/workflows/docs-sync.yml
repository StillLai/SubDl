name: Docs Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 防止多次运行重叠
concurrency:
  group: docs-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Get latest sing-box commit SHA
      id: get_sha
      run: |
        SHA=$(curl -s https://api.github.com/repos/reF1nd/sing-box/branches/reF1nd-stable | jq -r '.commit.sha')
        if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
          echo "::error::Failed to extract commit SHA from sing-box branch info"
          exit 1
        fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "Latest commit: $SHA"

    - name: Restore docs cache
      id: cache-docs
      uses: actions/cache@v5
      with:
        path: sing-box-reF1nd-docs
        key: "sing-box-reF1nd-docs-${{ steps.get_sha.outputs.sha }}"

    - name: Sync sing-box docs
      run: |
        set -Eeuo pipefail
        if [ "${{ steps.cache-docs.outputs.cache-hit }}" != "true" ]; then
          echo "Cache miss, cloning sing-box..."
          git clone --depth 1 --filter=blob:none --sparse --branch reF1nd-stable https://github.com/reF1nd/sing-box.git /tmp/sing-box-reF1nd
          cd /tmp/sing-box-reF1nd
          git sparse-checkout set docs
          rm -rf "$GITHUB_WORKSPACE/sing-box-reF1nd-docs"
          cp -r docs "$GITHUB_WORKSPACE/sing-box-reF1nd-docs"
        else
          echo "Cache hit, skipping clone"
        fi

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add sing-box-reF1nd-docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Sync sing-box docs [skip ci]"
        git push
